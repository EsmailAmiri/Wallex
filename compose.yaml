services:
  madar:
    build:
      context: .
      target: production
    image: madar-wallex:2.0.0
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MADAR_HTTP_PORT:-8876}:8000"
    environment:
      MADAR_BIND: 0.0.0.0
      WALLEX_DASHBOARD_PORT: 8000
      MADAR_PUBLIC_PORT: ${MADAR_HTTP_PORT:-8876}
      MADAR_ALLOW_DOCKER_ROUTER: "1"
      LLM_BASE_URL: ${MADAR_LLM_BASE_URL:-http://host.docker.internal:20128/v1}
      WALLEX_MCP_URL: https://api.wallex.ir/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - madar_data:/app/data
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  madar_data:
